<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#e7eef2"><title>내상품 판매 등록 의뢰하기 | Korean Gift</title><link rel="stylesheet" href="market.css"></head><body><header><a class="brand" href="index.html">Korean <span>Gift</span></a><a href="index.html#gallery">컬렉션으로 돌아가기</a></header><main><h1>내상품 판매 등록 의뢰하기</h1><p class="lead">한국의 아름다움을 담은 상품을 소개해 주세요. 상품 스펙·가격·사진을 보내주시면 운영자가 검토하고, 승인한 상품이 컬렉션에 공개됩니다.</p><div id="message" class="notice" role="status" aria-live="polite"></div><section class="panel" id="auth-panel"><h2>이메일로 로그인</h2><p class="muted">제조자는 이메일 인증 후 신청할 수 있습니다. 승인 권한은 운영자 계정에만 부여됩니다.</p><form id="auth-form"><div class="grid"><label>이메일<input type="email" name="email" required autocomplete="username" maxlength="254"></label><label>비밀번호<input type="password" name="password" required minlength="10" maxlength="128" autocomplete="current-password"></label></div><div class="actions"><button type="submit">로그인</button><button type="button" id="signup" class="secondary">제조자 회원가입</button></div></form></section><section class="panel" id="submission-panel" hidden><div class="actions"><span id="account"></span><button id="logout" type="button" class="secondary">로그아웃</button></div><h2>상품 정보</h2><form id="submission-form"><fieldset><div class="grid"><div><label>제조사·브랜드명<input name="manufacturer" required maxlength="120"></label></div><div><label>담당자명<input name="contact_name" required maxlength="80"></label></div><div><label>연락 이메일<input name="contact_email" type="email" required maxlength="254"></label></div><div><label>연락처 (선택)<input name="contact_phone" type="tel" maxlength="40"></label></div><div><label>상품명<input name="name" required maxlength="100"></label></div><div><label>판매 희망 가격 (원)<input name="price_krw" required type="number" min="1" max="100000000" step="1"></label></div><div class="wide"><label>상품 소개<textarea name="description" required maxlength="3000"></textarea></label></div><div class="wide"><label>상품 스펙 — 소재·크기·구성·원산지<textarea name="specs" required maxlength="3000"></textarea></label></div><div class="wide"><label>대표 이미지 — JPG / PNG / WebP, 최대 5MB<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><img id="image-preview" class="preview" alt="대표 이미지 미리보기"></div><label class="check wide"><input name="rights" type="checkbox" required><span>이 상품과 이미지의 등록 권한을 보유하고 있으며, 승인 후 상품 정보·이미지·판매 가격이 공개되는 것에 동의합니다.</span></label><label class="check wide"><input name="privacy" type="checkbox" required><span>상품 심사와 연락을 위해 제조사명·담당자명·이메일·연락처를 운영자에게 제공하는 데 동의합니다. 해당 연락 정보는 공개 상품 페이지에 표시되지 않습니다. 철회를 원하면 신청 이메일로 운영자에게 요청할 수 있습니다.</span></label></div><div class="actions"><button type="submit">검토 의뢰하기</button></div></fieldset></form></section><section class="panel" id="my-panel" hidden><h2>내 신청 현황</h2><p class="muted">승인되기 전까지 컬렉션에는 공개되지 않습니다.</p><div id="my-requests"></div></section></main><footer>© 2026 Korean Gift</footer><script src="market-config.js"></script><script src="market-api.js"></script><script src="submit.js"></script></body></html>
