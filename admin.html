<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#e7eef2"><title>상품 관리 | Korean Gift</title><link rel="stylesheet" href="market.css"></head><body><header><a class="brand" href="index.html">Korean <span>Gift</span></a><a href="index.html">홈페이지</a></header><main><h1>상품 검토·관리</h1><p class="lead">제조자의 신청 내용을 검토하고 가격과 이미지를 수정한 뒤 공개를 승인합니다.</p><div id="message" class="notice" role="status" aria-live="polite"></div><section class="panel" id="auth-panel"><h2>이메일로 로그인</h2><p class="muted">등록된 운영자 계정으로 로그인해 주세요. 제조자 계정으로는 접근할 수 없습니다.</p><form id="auth-form"><div class="grid"><label>이메일<input type="email" name="email" required autocomplete="username" maxlength="254"></label><label>비밀번호<input type="password" name="password" required minlength="10" maxlength="128" autocomplete="current-password"></label></div><div class="actions"><button type="submit">로그인</button></div></form></section><section id="admin-panel" hidden><div class="actions"><button id="refresh" class="secondary">목록 새로고침</button><button id="logout" class="secondary">로그아웃</button></div><section class="panel"><h2>등록 의뢰 목록</h2><div id="requests" class="list"></div></section><section class="panel" id="editor-panel" hidden><h2 id="editor-title">상품 편집</h2><p id="private-details" class="muted"></p><form id="editor"><fieldset><div class="grid"><div><label>상품명<input name="name" required maxlength="100"></label></div><div><label>판매 희망 가격 (원)<input name="price_krw" required type="number" min="1" max="100000000" step="1"></label></div><div class="wide"><label>상품 소개<textarea name="description" required maxlength="3000"></textarea></label></div><div class="wide"><label>상품 스펙 — 소재·크기·구성·원산지<textarea name="specs" required maxlength="3000"></textarea></label></div><div class="wide"><label>영문 상품명<input name="name_en" maxlength="100"></label></div><div class="wide"><label>영문 소개<textarea name="description_en" maxlength="3000"></textarea></label></div><div class="wide"><label>영문 스펙<textarea name="specs_en" maxlength="3000"></textarea></label></div><div class="wide"><label>대표 이미지 교체 — 선택 시 저장에 반영<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><img id="editor-image" class="preview" alt="검토할 상품 이미지"></div><label class="check wide"><input type="checkbox" name="publish_en" checked disabled><span>한국어·영어 홈페이지에 함께 공개 — 승인 시 영문 상품명·소개·스펙 필요</span></label></div><div class="actions"><button type="submit">수정 내용 저장</button><button type="button" id="approve" class="secondary">저장 후 승인·공개</button><button type="button" id="reject" class="danger">반려</button><button type="button" id="unpublish" class="danger">공개 중지</button></div></fieldset></form><p class="muted">이미 공개된 상품을 수정하면 저장과 동시에 공개 정보도 갱신됩니다. 승인 버튼은 가격·이미지를 포함한 현재 편집 내용을 저장한 다음 공개합니다.</p></section></section></main><footer>© 2026 Korean Gift</footer><script src="market-config.js"></script><script src="market-api.js"></script><script src="admin.js"></script></body></html>
